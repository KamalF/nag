<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nag</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/32.png" sizes="32x32" type="image/png">
  <!-- --surface in each theme: the browser chrome follows the OS like the
       page does. The manifest's single theme_color is the one place that
       rule cannot reach (§9.3). -->
  <meta name="theme-color" content="#EFF1F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#212A2E" media="(prefers-color-scheme: dark)">
</head>
<body>
  <main>
    <section id="login" hidden>
      <input id="token" type="password" placeholder="Token" autocomplete="current-password">
      <button id="login-btn">Log in</button>
      <p id="login-error" role="alert"></p>
    </section>

    <section id="capture" hidden>
      <input id="text" type="text" placeholder="Remind me to…" enterkeyhint="done" maxlength="1000">
      <div id="chips"></div>
    </section>

    <!-- §9.2: absent entirely when push is working, which is its steady
         state. It is above the lists because it is the one thing whose
         absence you cannot notice. -->
    <section id="notify-slot" hidden></section>

    <section id="overdue-zone" hidden>
      <h2>Needs you now (<span id="overdue-count">0</span>)</h2>
      <ul id="overdue"></ul>
    </section>

    <section id="later-zone" hidden>
      <h2>Later</h2>
      <ul id="later"></ul>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
