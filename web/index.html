<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nag</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/32.png" sizes="32x32" type="image/png">
  <!-- --surface in each theme: the browser chrome follows the OS like the
       page does. The manifest's single theme_color is the one place that
       rule cannot reach (§9.3). -->
  <meta name="theme-color" content="#EFF1F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#212A2E" media="(prefers-color-scheme: dark)">
</head>
<body>
  <main id="main-app" class="app">
    <section id="login" class="login" hidden>
      <input id="token" type="password" placeholder="Token" aria-label="Token" autocomplete="current-password">
      <button id="login-btn" class="act pri" type="button">Log in</button>
      <p id="login-error" class="login-error" role="alert"></p>
    </section>

    <!-- the capture bar is built by app.js: the row editor is the same
         component (§9.2) -->
    <section id="capture" class="capture" hidden></section>

    <!-- §9.2: two consecutive poll failures; clears itself on the next
         success -->
    <p id="offline" class="offline" hidden></p>

    <!-- §9.2: absent entirely when push is working, which is its steady
         state. It is above the lists because it is the one thing whose
         absence you cannot notice. -->
    <section id="notify-slot" class="slot" hidden></section>

    <section id="overdue-zone" class="zone" hidden>
      <h2>Needs you now <em id="overdue-count">0</em></h2>
      <ul id="overdue" class="rows"></ul>
    </section>

    <div id="divider" class="divider" hidden></div>

    <section id="later-zone" class="zone" hidden>
      <h2>Waiting quietly</h2>
      <ul id="later" class="rows"></ul>
    </section>

    <!-- §9.2: the most-seen screen — the reward, not an error -->
    <section id="empty" class="empty" hidden>
      <p>Nothing waiting.</p>
      <span>Type above and pick when it should come back.</span>
    </section>
  </main>

  <!-- §9.6: the picker sheet, outside <main> so the page behind it can be
       made inert while it is up. Nothing is written until Set reminder. -->
  <!-- one region for errors and the undo offer, so both are announced -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <div id="scrim" class="scrim"></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="summary">
    <div class="grab"></div>
    <p id="summary" class="summary"></p>
    <p id="relative" class="relative"></p>

    <div class="calhead">
      <button type="button" id="prev-month" aria-label="Previous month">‹</button>
      <span id="month" class="month"></span>
      <button type="button" id="next-month" aria-label="Next month">›</button>
    </div>
    <div id="dow" class="dow"></div>
    <div id="grid" class="grid"></div>

    <p class="tlabel">Time</p>
    <div class="wheels">
      <div class="band"></div>
      <div id="hours" class="wheel" aria-label="Hour"></div>
      <span class="colon">:</span>
      <div id="minutes" class="wheel" aria-label="Minute"></div>
    </div>

    <div class="sheet-actions">
      <button type="button" id="picker-cancel" class="btn-ghost">Cancel</button>
      <button type="button" id="picker-set" class="btn-set">Set reminder</button>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
