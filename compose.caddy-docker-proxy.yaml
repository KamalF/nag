# Layered on compose.yaml for hosts that run caddy-docker-proxy. Enable it
# once with a line in .env (not nag.env):
#   COMPOSE_FILE=compose.yaml:compose.caddy-docker-proxy.yaml
# Every docker compose command then needs the external caddy network.
services:
  nag:
    networks: [caddy]
    labels:
      caddy: nag.example.com
      caddy.reverse_proxy: "{{upstreams 8080}}"

networks:
  caddy:
    external: true
