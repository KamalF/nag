services:
  nag:
    # pulled from GHCR when absent. `docker compose build` builds it from this
    # checkout instead, and Compose falls back to that build when the pull fails
    image: ghcr.io/kamalf/nag:latest
    build: .
    # bind mounts, not named volumes (§10.1). Docker creates a named volume
    # owned by root, and the scratch image has no shell to chown it from
    # inside. A bind mount is chowned once on the host, a wrong uid fails at
    # boot with the path named, and a backup is a cp of data/nag.db*
    volumes:
      - ./data:/data
      - ./config:/config
    env_file: ./nag.env
    # loopback only: an HTTPS reverse proxy on this host forwards requests here
    # (service workers and Web Push need HTTPS)
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    # a ceiling, not a budget: nag runs in a few tens of MB. With this limit,
    # a channel endpoint that answers with an endless body (shoutrrr reads it
    # whole) restarts this container, not the host (SPEC §7.2)
    mem_limit: 256m
