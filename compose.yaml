services:
  nag:
    # pulled from GHCR when absent; `docker compose build` makes it from this
    # checkout instead, and Compose falls back to that when the pull fails
    image: ghcr.io/kamalf/nag:latest
    build: .
    volumes:
      - ./data:/data
      - ./config:/config
    env_file: ./nag.env
    # loopback only: an HTTPS reverse proxy on this host sits in front
    # (service workers and Web Push need HTTPS)
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    # a ceiling, not a budget: nag runs in a few tens of MB. It is there so a
    # channel endpoint that answers with an endless body (shoutrrr reads it
    # whole) restarts this container, not the box (SPEC §7.2)
    mem_limit: 256m
