services:
  nag:
    build: .
    image: nag:latest
    volumes:
      - ./data:/data
      - ./config:/config
    env_file: ./nag.env
    networks: [caddy]
    restart: unless-stopped
    labels:
      caddy: nag.example.com
      caddy.reverse_proxy: "{{upstreams 8080}}"

networks:
  caddy:
    external: true
